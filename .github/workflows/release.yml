name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PEBBLE_TOOL_VERSION: "5.1.2"
  PEBBLE_SDK_VERSION: "4.33.1"

jobs:
  release:
    name: Build and publish .pbw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both projects share one version number, and the tag must match it
      # (v1.1.0 <-> 1.1.0).
      - name: Check tag matches package.json versions
        run: |
          for pkg in package.json solar-times/package.json; do
            version="$(node -p "require('./${pkg}').version")"
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match ${pkg} version ${version}" >&2
              exit 1
            fi
          done

      # Debug flags must be off in releases.
      - name: Check debug flags are off
        run: |
          grep -qE '^#define DEBUG_FAKE_MINUTE -1$' src/c/main.c
          grep -qE '^#define DEMO_MODE 0$' src/c/main.c
          grep -qE '^#define DEBUG_FAKE_MINUTE -1$' solar-times/src/c/main.c

      - uses: astral-sh/setup-uv@v6

      - name: Install pebble-tool
        run: uv tool install --python 3.13 "pebble-tool==${PEBBLE_TOOL_VERSION}"

      # pebble-tool creates this folder with a non-atomic exists/makedirs check
      # that can crash with FileExistsError; creating it up front avoids that.
      - name: Prepare Pebble SDK folder
        run: mkdir -p ~/.local/share/pebble-sdk/oauth_firebase

      # The cache includes the SDKs/current symlink, so a restored SDK is
      # already active and needs no `pebble sdk activate`.
      - name: Cache Pebble SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk/SDKs
          key: pebble-sdk-${{ runner.os }}-${{ env.PEBBLE_SDK_VERSION }}

      - name: Install Pebble SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: pebble sdk install "${PEBBLE_SDK_VERSION}"

      - name: Build watchface
        run: pebble build

      - name: Build Solar Times app
        working-directory: solar-times
        run: pebble build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp build/*.pbw "dist/solar-${version}.pbw"
          cp solar-times/build/*.pbw "dist/solar-times-${version}.pbw"
          gh release create "${GITHUB_REF_NAME}" dist/*.pbw \
            --title "Solar ${GITHUB_REF_NAME}" \
            --generate-notes
